# Main nginx configuration for the Docker image. The image runs as UID 101;
# writable PID/temporary files stay in /tmp while application files stay read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Container stdout/stderr are collected under the Docker host's log policy.
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Keep any request/proxy buffering away from the read-only image filesystem.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The entrypoint generates an http-context include with maps, a server block,
    # public config alias and CSP hashes. Keep it inside http, not inside a server.
    include /run/dobbelt-pi-hole/nginx.conf;
}
