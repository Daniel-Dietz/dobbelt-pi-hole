		<meta charset="UTF-8">

		<title data-i18n="app.title">Dobbelt-Pi-hole v1.5.009 · Dashboard</title>
		<meta name="description" data-i18n-content="app.description" content="A combined dashboard for two, three or four Pi-hole v6 instances.">
		<style>
/* Theme variables: dark defaults and shared instance colors. */
:root {
  --bg: #0d1117;
  --panel: #151b23;
  --panel2: #1c232d;
  --border: #2a323d;
  --text: #e6edf3;
  --muted: #8b98a5;
  --muted2: #5d6a78;
  --green: #3fb950;
  --red: #e05252;
  --amber: #d29922;
  --blue: #5b8def;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius: 8px;
  --c-1: #5b8def;
  --c-2: #e3b341;
  --c-3: #c297ff;
  --c-4: #ff8a3d;
  --header-1: #12181f;
  --header-2: #0d1117;
  --log-bg: #05070a;
  --log-text: #e6edf3
}

/* Light mode replaces theme colors while keeping the same layout. */
:root[data-theme="light"] {
  --bg: #f2f4f7;
  --panel: #fff;
  --panel2: #eef1f5;
  --border: #d7dde3;
  --text: #1c232d;
  --muted: #5b6673;
  --muted2: #8b98a5;
  --header-1: #fff;
  --header-2: #f2f4f7;
  --log-bg: #f2f4f7;
  --log-text: #1c232d
}

/* Base sizing and typography shared by every view. */
* {
  box-sizing: border-box
}

html,body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  overflow-x: hidden;
  transition: background .2s ease,color .2s ease
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column
}

code,.mono,input,select,textarea,table {
  font-family: var(--mono)
}

input,select,textarea,button {
  font-size: 13px
}

/* Header layout keeps view controls and server status together. */
header.topbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg,var(--header-1),var(--header-2))
}

.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px
}

.language-select {
  min-width: 72px;
  width: auto;
  padding: 5px 7px;
  font-family: var(--sans)
}

header.topbar h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 600;
  letter-spacing: .2px
}

header.topbar h1 .dim {
  color: var(--muted);
  font-weight: 400
}

/* Connection pills distinguish active and disconnected instances. */
.pills {
  display: flex;
  gap: 10px;
  flex-wrap: wrap
}

.pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px 5px 8px;
  font-size: 12.5px;
  color: var(--muted)
}

.pill .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--muted2);
  flex: none
}

.pill.on .dot {
  background: var(--green);
  box-shadow: 0 0 6px var(--green)
}

.pill.off .dot {
  background: var(--red)
}

.pill b {
  color: var(--text)
}

/* Theme controls follow the root appearance setting. */
.theme-toggle {
  width: 52px;
  height: 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  padding: 0;
  position: relative;
  flex: none;
  background: #0d1520;
  transition: background .25s ease
}

.theme-toggle-knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #38bdf8;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateX(24px);
  transition: transform .25s ease,background .25s ease
}

.theme-toggle-knob svg {
  width: 14px;
  height: 14px
}

.theme-toggle .icon-sun {
  display: none
}

.theme-toggle .icon-moon {
  display: block
}

:root[data-theme="light"] .theme-toggle {
  background: #fde68a
}

:root[data-theme="light"] .theme-toggle-knob {
  transform: translateX(0);
  background: #f5a524
}

:root[data-theme="light"] .theme-toggle .icon-sun {
  display: block
}

:root[data-theme="light"] .theme-toggle .icon-moon {
  display: none
}

/* Navigation and responsive dashboard layout. */
nav.tabs {
  display: flex;
  gap: 2px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  overflow-x: auto
}

nav.tabs button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 11px 14px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  white-space: nowrap
}

nav.tabs button:hover {
  color: var(--text)
}

nav.tabs button.active {
  color: var(--text);
  border-bottom-color: var(--blue)
}

main {
  flex: 1;
  padding: 20px;
  max-width: 1900px;
  width: 100%;
  margin: 0 auto
}

.grid {
  display: grid;
  gap: 14px;
  min-width: 0
}

.grid.cols-2 {
  grid-template-columns: 1fr 1fr
}

.grid.cols-3 {
  grid-template-columns: repeat(3,1fr)
}

@media (min-width:821px) and (max-width:1300px) {

  #dashGrid,#dashDetailGrid {
    grid-template-columns: repeat(2,minmax(0,1fr))!important
  }
}

@media (max-width:820px) {

  #dashGrid,#dashDetailGrid {
    grid-template-columns: 1fr!important
  }

  .grid.cols-2,.grid.cols-3 {
    grid-template-columns: 1fr
  }
}

/* Chart groups adapt to the server count and available width. */
.donut-groups {
  display: grid;
  grid-template-columns: minmax(0,1fr);
  gap: 14px
}

.donut-group {
  display: grid;
  grid-template-columns: repeat(var(--server-count),minmax(0,1fr));
  gap: 14px;
  min-width: 0
}

@media (min-width:821px) and (max-width:1300px) {

  .donut-groups {
    grid-template-columns: repeat(2,minmax(0,1fr))
  }

  .donut-group {
    grid-template-columns: minmax(0,1fr);
    align-content: start
  }
}

@media (max-width:820px) {

  .donut-group {
    grid-template-columns: minmax(0,1fr)
  }
}

/* Cards, instance tags and summary statistics. */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  min-width: 0;
  box-sizing: border-box
}

.card h2 {
  margin: 0 0 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px
}

.card h2 .tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 5px;
  font-weight: 600;
  letter-spacing: .3px
}

.tag-1 {
  background: color-mix(in srgb,var(--c-1) 22%,transparent);
  color: var(--c-1)
}

.tag-2 {
  background: color-mix(in srgb,var(--c-2) 22%,transparent);
  color: var(--c-2)
}

.tag-3 {
  background: color-mix(in srgb,var(--c-3) 22%,transparent);
  color: var(--c-3)
}

.tag-4 {
  background: color-mix(in srgb,var(--c-4) 22%,transparent);
  color: var(--c-4)
}

.tag-combo {
  background: color-mix(in srgb,var(--green) 22%,transparent);
  color: var(--green)
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 13px
}

.stat-row:last-child {
  border-bottom: none
}

.stat-row .k {
  color: var(--muted)
}

.stat-row .v {
  font-weight: 600
}

.big-num {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1
}

.sub {
  color: var(--muted);
  font-size: 12px
}

/* Form fields and action buttons shared by the management views. */
button.btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 13px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px
}

button.btn:hover {
  border-color: var(--blue)
}

button.btn:disabled {
  opacity: .5;
  cursor: not-allowed
}

button.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #06101f;
  font-weight: 600
}

button.btn.danger {
  background: transparent;
  border-color: var(--red);
  color: var(--red)
}

button.btn.danger:hover {
  background: color-mix(in srgb,var(--red) 15%,transparent)
}

button.btn.success {
  background: var(--green);
  border-color: var(--green);
  color: #06210d;
  font-weight: 600
}

button.btn.xs {
  padding: 3px 8px;
  font-size: 11.5px
}

button.btn.block {
  width: 100%
}

.row-inline {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center
}

input[type=text],input[type=password],input[type=number],select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 9px;
  border-radius: 6px;
  min-width: 0
}

label.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
  flex: 1;
  min-width: 140px
}

label.field input,label.field select {
  width: 100%
}

/* Comparison tables keep headers visible and highlight mismatched data. */
table.datatable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px
}

table.datatable th {
  text-align: left;
  color: var(--muted);
  font-weight: 600;
  font-size: 11.5px;
  text-transform: none;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--panel)
}

table.datatable td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle
}

table.datatable tr:hover td {
  background: var(--panel2)
}

table.datatable tr.row-mismatch td {
  background: color-mix(in srgb,var(--red) 14%,var(--panel))
}

table.datatable tr.row-mismatch:hover td {
  background: color-mix(in srgb,var(--red) 20%,var(--panel))
}

.sync-col,.sync-actions {
  text-align: center!important;
  white-space: nowrap;
  width: 64px
}

.sync-actions .btn {
  padding-left: 7px;
  padding-right: 7px
}

.server-chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600
}

.server-chip.s1 {
  background: color-mix(in srgb,var(--c-1) 20%,transparent);
  color: var(--c-1)
}

.server-chip.s2 {
  background: color-mix(in srgb,var(--c-2) 20%,transparent);
  color: var(--c-2)
}

.server-chip.s3 {
  background: color-mix(in srgb,var(--c-3) 20%,transparent);
  color: var(--c-3)
}

.server-chip.s4 {
  background: color-mix(in srgb,var(--c-4) 20%,transparent);
  color: var(--c-4)
}

.badge {
  padding: 1px 7px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600
}

.badge.on {
  background: color-mix(in srgb,var(--green) 20%,transparent);
  color: var(--green)
}

.badge.off {
  background: color-mix(in srgb,var(--red) 20%,transparent);
  color: var(--red)
}

.table-wrap {
  max-height: 520px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px
}

.table-wrap table {
  margin: 0
}

.list-table-wrap table {
  min-width: 750px
}

.list-table-wrap th:first-child,.list-table-wrap td:first-child {
  min-width: 200px;
  width: 200px;
  overflow-wrap: anywhere
}

.client-table-wrap table {
  min-width: 650px
}

.client-table-wrap th:first-child,.client-table-wrap td:first-child {
  min-width: 140px
}

.client-table-wrap th:nth-child(2),.client-table-wrap td:nth-child(2) {
  min-width: 190px
}

/* Toast notifications stay above the current view. */
.toast-area {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 999;
  max-width: 360px
}

.toast {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--blue);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  box-shadow: 0 6px 18px #0006
}

.toast.ok {
  border-left-color: var(--green)
}

.toast.err {
  border-left-color: var(--red)
}

/* Expandable help and streamed Gravity output. */
details.help {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px
}

details.help summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 13px
}

details.help .help-body {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.55
}

details.help .help-body code {
  background: var(--panel2);
  padding: 1px 5px;
  border-radius: 4px;
  color: var(--text)
}

details.help .help-body h3 {
  color: var(--text);
  font-size: 12.5px;
  margin: 14px 0 4px
}

pre.log {
  background: var(--log-bg);
  color: var(--log-text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.5;
  max-height: 360px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all
}

.log-gray {
  color: #8b98a5
}

.log-red {
  color: #ff6b6b
}

.log-green {
  color: #3fb950
}

.log-yellow {
  color: #d29922
}

.log-blue {
  color: #5b8def
}

.log-purple {
  color: #c297ff
}

.log-cyan {
  color: #56d4dd
}

/* Shared text, empty-state and alignment utilities. */
.text-bold {
  font-weight: 700
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 20px;
  text-align: center
}

.muted {
  color: var(--muted)
}

.flex-between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap
}

select#targetSelect,.target-select {
  min-width: 170px
}

hr.sep {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0
}

.kv {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 6px 10px;
  font-size: 12.5px
}

/* Compact chart bars prevent long labels from expanding the page. */
.bar-row {
  margin-bottom: 9px;
  min-width: 0
}

.bar-row .bar-label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  min-width: 0
}

.bar-row .bar-label .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 75%;
  min-width: 0;
  flex-shrink: 1
}

.bar-row .bar-label .muted {
  flex-shrink: 0
}

.bar-track {
  background: var(--panel2);
  border-radius: 4px;
  height: 6px;
  overflow: hidden;
  margin-top: 3px
}

.bar-fill {
  height: 100%;
  border-radius: 4px
}

.bar-fill.allowed {
  background: var(--green)
}

.bar-fill.blocked {
  background: var(--red)
}

.bar-fill.neutral {
  background: var(--blue)
}

h3.mini-title {
  font-size: 12.5px;
  color: var(--muted);
  margin: 16px 0 8px;
  font-weight: 600
}

h3.mini-title:first-of-type {
  margin-top: 0
}

.kv .k {
  color: var(--muted)
}
</style>
	</head>

		<header class="topbar">
			<div class="topbar-row">
				<h1>Pi-hole <span class="dim" data-i18n="app.headingSuffix">· dashboard</span></h1>
			<div class="topbar-actions">
			<select class="language-select" id="languageSelect" data-i18n-aria-label="app.language" data-i18n-title="app.language" aria-label="Language" title="Language">
				<option value="da" lang="da">Dansk</option>
				<option value="en" lang="en">English</option>
				<option value="de" lang="de">Deutsch</option>
			</select>
			<button class="theme-toggle" id="themeToggle" data-i18n-aria-label="app.themeToggle" data-i18n-title="app.themeToggle" aria-label="Switch between light and dark mode" title="Switch between light and dark mode">
					<span class="theme-toggle-knob">
						<svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<circle cx="12" cy="12" r="4.5" fill="currentColor"/>
							<g stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<path d="M12 1.5v2.5M12 20v2.5M22.5 12H20M4 12H1.5M19.07 4.93l-1.77 1.77M6.7 17.3l-1.77 1.77M19.07 19.07l-1.77-1.77M6.7 6.7 4.93 4.93"/>
							</g>
						</svg>
						<svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/>
						</svg>
					</span>
				</button>
			</div>
			</div>
			<div class="pills" id="serverPills"></div>
		</header>
		<nav class="tabs" id="tabs"></nav>
		<main id="tabContent"></main>
		<div class="toast-area" id="toastArea" role="status" aria-live="polite" aria-atomic="false"></div>
		<script src="chart.umd.min.js"></script>
		<script>
"use strict";

/**
 * Browser application for the generated same-origin Pi-hole routes.
 *
 * Startup validates public configuration before restoring route-bound sessions.
 * Shared helpers handle storage, translation, API calls and navigation; each tab
 * renderer owns its view and passes the render generation through asynchronous
 * work. Gravity runs retain their output separately so navigation can rebuild
 * their controls without restarting an update.
 *
 * Keep this maintained source readable and document code in English. User-facing
 * text belongs in the language catalogs below. See docs/DEVELOPMENT.md for the
 * source layout, test entry points and deployment requirements after HTML edits.
 */
const CONFIG_KEY = "ph_combo_cfg_v2"; // Legacy browser labels; never used for targets.
const LABELS_KEY = "ph_combo_labels_v1";
const RUNTIME_CONFIG_URL = "./config.json";
const CONFIG_TIMEOUT_MS = 10000;
const SESSION_CHECK_TIMEOUT_MS = 10000;
const UI_STATE_KEY = "ph_combo_ui_v1";
const DEFAULT_UI_STATE = {
  queries: {
    range: "6",
    filter: "",
    server: "all",
    client: "all",
    type: "all",
    pageSize: "50",
    sortKey: "time",
    sortDir: "desc",
    page: 0
  },
  hosts: {
    sortKey: "name",
    sortDir: "asc"
  },
  clients: {
    sortKey: "client",
    sortDir: "asc",
    pageSize: "50",
    page: 0,
    suggPageSize: "50",
    suggPage: 0
  }
};

/* ---------------- Keyed translations ---------------- */
const I18N = {
  "da": {
    "app.title": "Dobbelt-Pi-hole v{version} · Kontrolpanel",
    "app.description": "Et samlet kontrolpanel til to, tre eller fire Pi-hole v6-instanser.",
    "app.headingSuffix": "· kontrolpanel",
    "app.language": "Sprog",
    "app.themeToggle": "Skift mellem lys og mørk tilstand",
    "tabs.dashboard": "Dashboard",
    "tabs.queries": "Forespørgsler",
    "tabs.domains": "Domæner",
    "tabs.hosts": "Lokal DNS",
    "tabs.clients": "Klienter",
    "tabs.lists": "Lister",
    "tabs.gravity": "Gravity",
    "tabs.settings": "Indstillinger",

/**
 * Read a browser preference or session value without making storage mandatory.
 * Return null when the key is absent or the browser blocks access.
 * @param {string} key Storage key to read.
 * @param {string} storageName Window storage property, usually localStorage or sessionStorage.
 * @returns {string|null} The stored value, when accessible.
 */
function storedValue(key, storageName = "localStorage") {
  try {
    return window[storageName].getItem(key);
  } catch {
    return null;
  }
}

/**
 * Save a browser value, or remove its key when value is null.
 * Storage failures are ignored; callers keep any live state in memory.
 * @param {string} key Storage key to update.
 * @param {string|null} value Text to persist, or null to remove it.
 * @param {string} storageName Window storage property to use.
 */
function storeValue(key, value, storageName = "localStorage") {
  try {
    if (value === null) {
      window[storageName].removeItem(key);
    } else {
      window[storageName].setItem(key, value);
    }
  } catch {/* Preferences and sessions continue in memory for this page. */}
}

/**
 * Return a supported base language code from a language or regional tag.
 * Whitespace, case and underscore separators are normalized; unsupported values return null.
 */

      const rightValue = getSortValue(rightRow);
      const comparison = typeof leftValue == "number" && typeof rightValue == "number" ? leftValue - rightValue : compareIpAware(leftValue, rightValue);
      return sortDirection === "asc" ? comparison : -comparison;
    });
    const queryTableArea = document.getElementById("qArea");
    persistQueryState();
    if (!state.servers.some(/** Check whether any configured instance has a usable login before displaying query results. */ sessionCandidate => sessionCandidate.connected)) {
      queryTableArea.innerHTML = `<div class="empty">${htmlMsg("queries.loginRequired")}<br><br>${state.servers.map(loginBoxHtml).join("<br>")}</div>`;
      bindLoginHandlers(queryTableArea, reloadQueries);
      return;
    }
    if (filteredRows.length === 0) {
      queryTableArea.innerHTML = `<p class="empty">${htmlMsg("queries.empty")}</p>`;
      return;
    }
    const pageSize = pageSizeOf("qPageSize");
    const pageCount = Math.max(1, Math.ceil(filteredRows.length / pageSize));
    if (pageIndex >= pageCount) {
      pageIndex = pageCount - 1;
    }
    if (pageIndex < 0) {
      pageIndex = 0;
    }
    persistQueryState();
    const pageOffset = pageIndex * pageSize;
    const visibleRows = Number.isFinite(pageSize) ? filteredRows.slice(pageOffset, pageOffset + pageSize) : filteredRows;
    const renderSortHeading = /** Build a translated sortable query heading and show the current direction on its active column. */ (columnKey, headingKey) => {
      const indicator = sortKey === columnKey ? sortDirection === "asc" ? " \u25B2" : " \u25BC" : "";
      return `<th data-sort="${columnKey}" style="cursor:pointer;user-select:none;">${htmlMsg(headingKey)}${indicator}</th>`;
    };
    queryTableArea.innerHTML = `<div class="table-wrap"><table class="datatable">
				<thead><tr>
					${renderSortHeading("time", "queries.time")}${renderSortHeading("server", "queries.server")}${renderSortHeading("status", "queries.status")}${renderSortHeading("type", "queries.type")}${renderSortHeading("domain", "queries.domain")}${renderSortHeading("client", "queries.client")}
				</tr></thead>
				<tbody>${visibleRows.map(/** Render one query with its source instance and escaped domain, status, type and client values. */ visibleRow => `<tr>

						<td>${escapeHtml(String(visibleRow.status ?? "–"))}</td>
						<td>${escapeHtml(String(visibleRow.type ?? "–"))}</td>

						<td class="mono">${escapeHtml(clientDisplayName(visibleRow.client))}</td>

    for (const sortHeading of queryTableArea.querySelectorAll("[data-sort]")) {
      sortHeading.addEventListener("click", /** Select or reverse a query sort column, defaulting a newly selected time column to newest first. */ () => {
        const clickedColumn = sortHeading.dataset.sort;
        if (sortKey === clickedColumn) {

    const previousPageButton = document.getElementById("qPagePrev");
    const nextPageButton = document.getElementById("qPageNext");
    if (previousPageButton) {

        pageIndex--;
        renderQueryTable(false);
      });
    }
    if (nextPageButton) {
      nextPageButton.addEventListener("click", /** Show the next query page while preserving filters and sort order. */ () => {
        pageIndex++;
        renderQueryTable(false);
      });

  /**
   * Follow one instance's query cursor for at most 20 pages of 500 rows.
   * @param {Object} pageServer Instance whose query history is being read.
   * @param {number} pageFromTimestamp Beginning of the time window, in Unix seconds.
   * @param {number} pageUntilTimestamp End of the time window, in Unix seconds.
   * @param {*} initialCursor Cursor returned with the initial page.
   * @returns {Promise<Object>} Collected rows, a truncation flag and the remaining cursor, if any.
   */
  async function fetchQueryPages(pageServer, pageFromTimestamp, pageUntilTimestamp, initialCursor) {
    const collectedRows = [];
    let cursor = undefined !== initialCursor ? initialCursor : null;
    for (let fetchPageIndex = 0; fetchPageIndex < 20; fetchPageIndex++) {
      let queryPath = "/queries?length=500&from=" + pageFromTimestamp + "&until=" + pageUntilTimestamp;
      if (cursor != null) {
        queryPath += "&cursor=" + encodeURIComponent(cursor);
      }
      const pageResponse = await apiCall(pageServer, queryPath);
      const pageRows = pageResponse.queries || [];
      collectedRows.push(...pageRows);
      if (!pageResponse.cursor || pageRows.length === 0) {
        return {
          rows: collectedRows,
          truncated: false,
          cursor: null
        };
      }
      cursor = pageResponse.cursor;
    }
    return {
      rows: collectedRows,
      truncated: true,
      cursor
    };
  }
  /**
   * Reload the selected query time window in two rendering stages.
   * Render after all instances finish their initial requests of up to 100 rows each,
   * then render again after all follow-up requests finish (at most 20 pages of 500 per instance).
   * Report per-instance request failures and indicate when that follow-up limit truncates results.
   */
  async function reloadQueries() {
    const rangeHours = Number(document.getElementById("qRange").value);
    const untilTimestamp = Math.floor(Date.now() / 1000);
    const fromTimestamp = untilTimestamp - 3600 * rangeHours;
    const loadingArea = document.getElementById("qArea");
    const queryStatus = document.getElementById("qStatus");
    loadingArea.innerHTML = `<p class="empty">${htmlMsg("queries.loading")}</p>`;
    queryStatus.textContent = "";
    queryRows = [];
    const cursorsByServer = {};
    await Promise.all(state.servers.map(/** Fetch one instance's initial query page and remember its cursor for the follow-up request. */ async initialServer => {
      if (initialServer.connected) {
        try {
          const initialResponse = await apiCall(initialServer, "/queries?length=100&from=" + fromTimestamp + "&until=" + untilTimestamp);
          for (const initialRow of initialResponse.queries || []) {
            queryRows.push({
              server: initialServer,
              ...initialRow
            });
          }
          if (initialResponse.cursor) {
            cursorsByServer[initialServer.id] = initialResponse.cursor;
          }
        } catch (initialError) {
          toast(msg("queries.serverError", {
            server: initialServer.label,
            error: initialError.message
          }), "err");
        }
      }
    }));
    if (generation !== state.renderGen) {
      return;
    }
    rebuildQueryFilters();
    renderQueryTable(false);
    const hasMorePages = Object.keys(cursorsByServer).length > 0;
    queryStatus.textContent = msgCount(hasMorePages ? "queries.loadingMore" : "queries.total", queryRows.length);
    if (!hasMorePages) {
      return;
    }
    let anyTruncated = false;
    await Promise.all(state.servers.map(/** Fetch the remaining bounded pages for an instance with a cursor and append rows with their source server. */ async remainingServer => {
      if (remainingServer.connected && cursorsByServer[remainingServer.id]) {
        try {
          const {
            rows: remainingRows,
            truncated: serverTruncated
          } = await fetchQueryPages(remainingServer, fromTimestamp, untilTimestamp, cursorsByServer[remainingServer.id]);
          if (serverTruncated) {
            anyTruncated = true;
          }
          for (const remainingRow of remainingRows) {
            queryRows.push({
              server: remainingServer,
              ...remainingRow
            });
          }
        } catch (remainingError) {
          toast(msg("queries.serverError", {
            server: remainingServer.label,
            error: remainingError.message
          }), "err");
        }
      }
    }));
    if (generation === state.renderGen) {
      queryStatus.textContent = msgCount(anyTruncated ? "queries.truncated" : "queries.total", queryRows.length);
      rebuildQueryFilters();
      renderQueryTable(false);
    }
  }
  document.getElementById("qReload").addEventListener("click", /** Save query preferences before explicitly reloading the selected time window. */ () => {
    persistQueryState();
    reloadQueries();
  });
  document.getElementById("qRange").addEventListener("change", /** Persist a new time range and reload its query history. */ () => {
    persistQueryState();
    reloadQueries();
  });
  document.getElementById("qServerFilter").addEventListener("change", /** Apply the selected instance filter and return to the first query page. */ () => renderQueryTable());
  document.getElementById("qClientFilter").addEventListener("change", /** Remember the selected client filter before redrawing the query table. */ clientChangeEvent => {
    selectedClient = clientChangeEvent.target.value;
    renderQueryTable();
  });
  document.getElementById("qTypeFilter").addEventListener("change", /** Remember the selected query type before redrawing the query table. */ typeChangeEvent => {
    selectedQueryType = typeChangeEvent.target.value;
    renderQueryTable();
  });
  document.getElementById("qPageSize").addEventListener("change", /** Apply a new query page size starting from the first page. */ () => renderQueryTable());
  document.getElementById("qFilter").addEventListener("keyup", /** Apply the free-text query filter when the user presses Enter. */ filterKeyEvent => {
    if (filterKeyEvent.key === "Enter") {
      renderQueryTable();
    }
  });
  document.getElementById("qFilter").addEventListener("input", /** Update query matches as the free-text filter is edited. */ () => renderQueryTable());
  await reloadQueries();
}


/** Reject an incomplete Pi-hole collection response instead of treating it as empty. */
function requireCollection(result, key) {
  if (!result || !Array.isArray(result[key])) throw new Error(msg("multi.invalidRead"));
  return result[key];
}
/** Require an explicit hosts array in the nested configuration response. */
function requireHostRecords(result) {
  const rows = result?.config?.dns?.hosts;
  if (!Array.isArray(rows)) throw new Error(msg("multi.invalidRead"));
  return rows;
}
/** Render a read failure or disconnected server without offering mutating controls. */
function uncertainCell(states, server) {
  const kind = states.get(server.id);
  return kind === "confirmed" ? "" : `<td><span class="badge off">${htmlMsg(kind === "skipped" ? "multi.disconnected" : "multi.unknown")}</span></td>`;
}
/** Explain which instances have not supplied complete data for this table. */
function collectionCoverageHtml(states) {
  const names = state.servers.filter(server => states.get(server.id) !== "confirmed").map(server => server.label);
  return names.length ? `<p class="sub" role="status">${htmlMsg("multi.unavailable", { servers: names.join(", ") })}</p>` : "";
}
/**
 * Preflight each selected target, then send at most one mutation per target.
 * An unsuccessful preflight prevents a write; transport/5xx write failures
 * remain uncertain and are never automatically retried.
 * @param {HTMLElement} button Button to disable against duplicate clicks.
 * @param {object[]} targets Selected Pi-hole instances.
 * @param {object} op Functions path(server), extract(result), isCurrent(server, rows), write(server, rows).
 * @returns {Promise<Array|null>} Per-instance outcomes; null when already in flight.
 */
async function performCheckedWrites(button, targets, op) {
  if (button?.dataset.multiBusy === "1") return null;
  if (button) { button.dataset.multiBusy = "1"; button.disabled = true; }
  const outcomes = [];
  try {
    for (const server of targets) {
      if (!server.connected) { outcomes.push({ server, status: "skipped" }); continue; }
      let rows;
      try { rows = op.extract(await apiCall(server, op.path(server))); }
      catch (error) { outcomes.push({ server, status: "failed", error: error.message }); continue; }
      let alreadyCurrent;
      try { alreadyCurrent = op.isCurrent(server, rows); }
      catch (error) { outcomes.push({ server, status: "failed", error: error.message }); continue; }
      if (alreadyCurrent) { outcomes.push({ server, status: "unchanged" }); continue; }
      try {
        const result = await op.write(server, rows);
        const errors = result?.processed?.errors || [];
        outcomes.push(errors.length
          ? { server, status: "failed", error: errors.map(item => item.error || item.item).join("; ") }
          : { server, status: "confirmed" });
      } catch (error) {
        outcomes.push({ server,
          status: error instanceof AuthError || (error.httpStatus >= 400 && error.httpStatus < 500) ? "failed" : "uncertain",
          error: error.message });
      }
    }
  } finally {
    if (button) { delete button.dataset.multiBusy; if (button.isConnected) button.disabled = false; }
  }
  for (const outcome of outcomes) {
    toast(msg("multi." + outcome.status, { server: outcome.server.label, error: outcome.error || "" }),
      outcome.status === "confirmed" ? "ok" : outcome.status === "unchanged" ? "" : "err");
  }
  return outcomes;
}
/**
 * Retain submitted form values unless all target outcomes are confirmed or
 * already current. Do not erase edits to an original or rerendered form.
 */
function clearConfirmedDraft(outcomes, form, fields) {
  if (!outcomes?.length || !outcomes.every(outcome => ["confirmed", "unchanged"].includes(outcome.status)) || !form.isConnected) return;
  for (const [selector, previous] of fields) {
    const input = form.querySelector(selector);
    if (input && input.value.trim() === previous) input.value = "";
  }
}

/**
 * Render domain and regular-expression rules with per-instance controls and a new-rule form.
 * Reads and writes remain separate requests for each instance; this view does not
 * provide an atomic operation across targets.
 * @param {HTMLElement} container Active-tab container to populate.
 * @param {number} generation Render generation assigned by switchTab.
 */
async function renderDomains(container, generation) {
  /**
   * Read connected instances' rules and merge rows by domain, allow/deny type and exact/regex kind.
   * Keep the original per-instance records for updates and suppress contradictory add
   * buttons when that instance already has the same domain/kind under another rule type.
   * Failed reads show a toast but currently contribute no records to the merged table.
   */
  async function loadDomains() {
    const domainArea = document.getElementById("domArea");
    domainArea.innerHTML = `<p class="empty">${htmlMsg("domains.loading")}</p>`;
    const readStates = new Map(state.servers.map(server => [server.id, "skipped"]));
    const rulesByKey = new Map();
    const existingKinds = new Set();
    let hasConnectedServer = false;
    await Promise.all(state.servers.map(/** Merge one connected instance's domain rules while retaining its original record and group assignments. */ async server => {
      if (server.connected) {
        hasConnectedServer = true;
        try {
          const response = await apiCall(server, "/domains");
          const records = requireCollection(response, "domains");
          readStates.set(server.id, "confirmed");
          for (const record of records) {
            existingKinds.add([server.id, record.domain, record.kind].join("\0"));
            const key = [record.domain, record.type, record.kind].join("\0");
            if (!rulesByKey.has(key)) {
              rulesByKey.set(key, {
                domain: record.domain,
                type: record.type,
                kind: record.kind,
                comment: record.comment || "",
                byServer: {}
              });
            }
            const row = rulesByKey.get(key);
            if (record.comment && !row.comment) {
              row.comment = record.comment;
            }
            row.byServer[server.id] = record;
          }
        } catch (error) {
          readStates.set(server.id, "unknown");
          toast(msg("domains.requestError", {
            server: server.label,
            error: error.message
          }), "err");
        }
      }
    }));
    if (generation !== state.renderGen) {
      return;
    }
    if (!hasConnectedServer) {
      domainArea.innerHTML = `<div class="empty">${htmlMsg("domains.loginRequired")}<br><br>${state.servers.map(loginBoxHtml).join("<br>")}</div>`;
      bindLoginHandlers(domainArea, loadDomains);
      return;
    }
    const rows = [...rulesByKey.values()].sort(/** Sort domain rules by natural domain name, then rule type and matching kind. */ (left, right) => left.domain.localeCompare(right.domain, localeCode(), {
      numeric: true,
      sensitivity: "base"
    }) || left.type.localeCompare(right.type, localeCode()) || left.kind.localeCompare(right.kind, localeCode()));
    if (rows.length !== 0) {
      domainArea.innerHTML = collectionCoverageHtml(readStates) + `<div class="table-wrap"><table class="datatable" style="min-width:950px;">
				<thead><tr><th>${htmlMsg("domains.domain")}</th>${state.servers.map(/** Render the configured instance's escaped label as a domain-table column heading. */ server => `<th>${escapeHtml(server.label)}</th>`).join("")}<th>${htmlMsg("domains.type")}</th><th>${htmlMsg("domains.kind")}</th><th>${htmlMsg("domains.comment")}</th><th></th></tr></thead>
				<tbody>${rows.map(/** Render a merged domain rule with per-instance state and row-level deletion controls. */ (row, rowIndex) => `<tr>
						<td class="mono">${escapeHtml(row.domain)}</td>
						${state.servers.map(/** Render an instance's rule state, toggle action or eligible add action without offering a conflicting rule. */ server => {
        if (readStates.get(server.id) !== "confirmed") return uncertainCell(readStates, server);
        const record = row.byServer[server.id];
        return record ? `<td><span class="badge ${record.enabled ? "on" : "off"}">${htmlMsg(record.enabled ? "domains.active" : "domains.disabled")}</span> <button class="btn xs" data-toggle-domain-server="${escapeHtml(server.id)}" data-domain-row="${rowIndex}">${htmlMsg(record.enabled ? "domains.deactivate" : "domains.activate")}</button></td>` : `<td><span class="badge off">${htmlMsg("domains.missing")}</span>${existingKinds.has([server.id, row.domain, row.kind].join("\0")) ? "" : ` <button class="btn xs" data-add-domain-server="${escapeHtml(server.id)}" data-domain-row="${rowIndex}">${htmlMsg("domains.add")}</button>`}</td>`;
      }).join("")}
						<td><span class="badge ${row.type === "deny" ? "off" : "on"}">${htmlMsg(row.type === "deny" ? "domains.ruleBlock" : "domains.allow")}</span></td>
						<td>${htmlMsg(row.kind === "regex" ? "domains.ruleRegex" : "domains.exact")}</td>
						<td>${escapeHtml(row.comment || "")}</td>
						<td><button class="btn xs danger" data-del-domain-row="${rowIndex}">${htmlMsg("domains.delete")}</button></td>
					</tr>`).join("")}</tbody>
				</table></div>`;
      for (const button of domainArea.querySelectorAll("[data-add-domain-server]")) {
        button.addEventListener("click", /** Copy the selected domain rule to one connected instance, retaining the source group assignments. */ async () => {

            return;
          }
          const outcomes = await performCheckedWrites(button, [server], {
            path: () => "/domains",
            extract: response => requireCollection(response, "domains"),
            isCurrent: (target, records) => {

                throw new Error(msg("multi.conflict"));

              return records.some(record => record.domain === row.domain && record.kind === row.kind && record.type === row.type);
            },
            write: target => apiCall(target, "/domains/" + row.type + "/" + row.kind, {
              method: "POST",
              body: { domain: [row.domain], comment: sourceRecord.comment ?? "", type: row.type,
                kind: row.kind, groups: sourceRecord.groups }

      for (const button of domainArea.querySelectorAll("[data-toggle-domain-server]")) {
        button.addEventListener("click", /** Toggle an existing domain rule on its own instance while preserving its comment, kind and groups. */ async () => {
          const server = serverById(button.dataset.toggleDomainServer);

          const record = row.byServer[server.id];
          if (record) {
            const desiredEnabled = !record.enabled;
            const outcomes = await performCheckedWrites(button, [server], {
              path: () => "/domains",
              extract: response => requireCollection(response, "domains"),
              isCurrent: (target, records) => {
                const current = records.find(item => item.domain === row.domain && item.type === row.type && item.kind === row.kind);
                if (!current || !Array.isArray(current.groups) || !Object.hasOwn(current, "comment")) {

          if (uiConfirm(msg("domains.confirmDelete", {

              path: () => "/domains",
              extract: response => requireCollection(response, "domains"),
              isCurrent: (server, records) => !records.some(record =>
                record.domain === row.domain && record.kind === row.kind && record.type === row.type),
              write: server => apiCall(server, "/domains/" + row.type + "/" + row.kind + "/" + encodeURIComponent(row.domain), { method: "DELETE" })
            });
            if (outcomes && container.isConnected && generation === state.renderGen) loadDomains();
          }
        });
      }

    }
  }
  container.innerHTML = `
				<div class="card" style="margin-bottom:14px;">
				<h2>${htmlMsg("domains.addTitle")}</h2>
				<form id="domainForm" class="row-inline">
					<label class="field" style="min-width:220px;"><span>${htmlMsg("domains.domainOrRegex")}</span>
					<input type="text" id="dDomain" placeholder="${htmlMsg("domains.domainPlaceholder")}" required>
					</label>
					<label class="field" style="min-width:100px;"><span>${htmlMsg("domains.type")}</span>
					<select id="dType"><option value="allow">${htmlMsg("domains.allow")}</option><option value="deny" selected>${htmlMsg("domains.block")}</option></select>
					</label>
					<label class="field" style="min-width:100px;"><span>${htmlMsg("domains.kind")}</span>
					<select id="dKind"><option value="exact">${htmlMsg("domains.exact")}</option><option value="regex">${htmlMsg("domains.regex")}</option></select>
					</label>
					<label class="field" style="min-width:160px;"><span>${htmlMsg("domains.comment")}</span>
					<input type="text" id="dComment" placeholder="${htmlMsg("domains.optional")}">
					</label>
					<label class="field" style="min-width:170px;"><span>${htmlMsg("domains.addTo")}</span>
					${targetSelectHtml("Domain")}
					</label>
					<button class="btn primary" type="submit" style="align-self:flex-end;">${htmlMsg("domains.add")}</button>
				</form>
				</div>
				<div class="card">

					<button class="btn" id="domReload">${htmlMsg("domains.reload")}</button>
				</div>
				<div id="domArea"><p class="empty">${htmlMsg("domains.loading")}</p></div>
				</div>`;
  document.getElementById("domReload").addEventListener("click", loadDomains);
  document.getElementById("domainForm").addEventListener("submit",
  /**
   * Submit a new rule separately to each selected connected instance and report individual request results.

  async event => {

/**
 * Escape streamed log text and render the supported ANSI colors and bold style as CSS spans.
 * Close all opened spans at a reset and at the end; other output remains escaped text.
 */
function ansiToHtml(text) {
  const stylesByEscape = {
    "\u001b[1m": "text-bold",
    "\u001b[90m": "log-gray",
    "\u001b[91m": "log-red",
    "\u001b[32m": "log-green",
    "\u001b[33m": "log-yellow",
    "\u001b[94m": "log-blue",
    "\u001b[95m": "log-purple",
    "\u001b[96m": "log-cyan"
  };
  let openSpans = 0;
  let html = escapeHtml(text);
  html = html.replace(/(\u001B\[(?:1|90|91|32|33|94|95|96|0)m)/gu, /** Convert a supported ANSI marker into an opening style span, or close every active span for a reset. */ escapeSequence => {
    if (escapeSequence === "\u001b[0m") {
      const closingTags = "</span>".repeat(openSpans);
      openSpans = 0;
      return closingTags;
    }
    if (stylesByEscape[escapeSequence]) {
      openSpans++;
      return `<span class="${stylesByEscape[escapeSequence]}">`;
    }
    return "";
  });
  return html + "</span>".repeat(openSpans);
}

 * Keep the server's raw output unchanged in memory and translate only dashboard status messages.
 * @param {HTMLElement} container Active-tab container to populate.

async function renderGravity(container, generation) {
  const runs = state.gravityRuns || (state.gravityRuns = new Map());

  /** Return this instance's retained Gravity run, creating its initial in-memory state on first access. */
  function runFor(server) {
    if (!runs.has(server.id)) {
      runs.set(server.id, {
        rawLog: "",

        status: "ready",

   * Paint retained Gravity state into any currently mounted controls for this instance.
   * Escape and style server output, translate dashboard status text and keep the log scrolled to its end.
   */
  function paint(server) {
    const run = runFor(server);
    const last = document.getElementById("gravLast" + server.id);
    const button = document.getElementById("gravBtn" + server.id);
    const log = document.getElementById("gravLog" + server.id);
    if (last) {

    }

        error: run.error
      });

      }
    } catch (error) {
      run.status = "error";
      run.error = error.message;
    } finally {
      run.running = false;
      paint(server);
    }
  }
  container.innerHTML = `<div class="grid cols-2">
    ${state.servers.map(/** Render one instance's Gravity controls with stable element IDs and its current running state. */ server => `<div class="card">
      <h2 class="flex-between"><span><span class="tag tag-${escapeHtml(server.chip.slice(1))}">${escapeHtml(server.label)}</span> ${htmlMsg("gravity.title")}</span></h2>
      <div class="stat-row" style="margin-bottom:12px;"><span class="k">${htmlMsg("gravity.lastUpdate")}</span><span class="v" id="gravLast${escapeHtml(server.id)}"></span></div>
      <div id="gravLogin${escapeHtml(server.id)}">${server.connected ? "" : loginBoxHtml(server)}</div>
      <button class="btn primary block" id="gravBtn${escapeHtml(server.id)}" ${!server.connected || runFor(server).running ? "disabled" : ""}>${htmlMsg("gravity.updateServer", {
    server: server.label
  })}</button>
      <pre class="log" id="gravLog${escapeHtml(server.id)}" style="margin-top:12px;"></pre>
    </div>`).join("")}
  </div>`;
  for (const server of state.servers) {
    bindLoginHandlers(document.getElementById("gravLogin" + server.id), /** Rebuild Gravity controls after a login change while keeping retained run output. */ () => switchTab("gravity"));
    document.getElementById("gravBtn" + server.id).addEventListener("click", /** Start the Gravity update for the instance attached to this button. */ () => update(server));
    paint(server);
  }
  await Promise.all(state.servers.map(refreshLastUpdate));
}

/**
 * Render configuration guidance and the browser-local server-name editor.
 * Saving or resetting names updates local preferences and labels; central routes
 * and Pi-hole configuration are never written by this settings view.
 * @param {HTMLElement} container Active-tab container to populate.
 */
async function renderSettings(container) {
  container.innerHTML = `
    <details class="help">
      <summary>${htmlMsg("settings.helpSummary")}</summary>
      <div class="help-body">
        <p>${htmlMsg("settings.proxyRequirement")}</p>
        <ul>${state.servers.map(/** Show a configured instance's escaped name and generated proxy route in the setup help. */ server => `<li><span class="server-chip ${escapeHtml(server.chip)}">${escapeHtml(server.label)}</span>: <code style="overflow-wrap:anywhere">${escapeHtml(server.base)}</code></li>`).join("")}</ul>
        <p>${htmlMsg("settings.proxyExample")} <code>config.json</code></p>
        <p>${htmlMsg("settings.proxyConfiguration")}</p>
        <h3>${htmlMsg("settings.appPasswordTitle")}</h3>
        <p>${htmlMsg("settings.appPasswordHelp")}</p>
        <h3>${htmlMsg("settings.sessionsTitle")}</h3>
        <p>${htmlMsg("settings.sessionsHelp")}</p>
      </div>
    </details>
    <div class="card">
      <h2>${htmlMsg("settings.title")}</h2>
      <form id="settingsForm">
        <p class="sub">${htmlMsg("settings.namesHelp")}</p>
        ${state.servers.map(/** Render a personal-name field tied to the configured instance's stable ID. */ server => `<div class="row-inline" style="margin-bottom:10px;">
          <span class="server-chip ${escapeHtml(server.chip)}">${htmlMsg("settings.server", {
    id: server.id
  })}</span><label class="field" style="max-width:260px;"><span>${htmlMsg("settings.label")}</span><input type="text" data-label="${escapeHtml(server.id)}" value="${escapeHtml(server.label)}" required></label>
        </div>`).join("")}
        <div class="row-inline">
          <button class="btn primary" type="submit">${htmlMsg("settings.save")}</button>
          <button class="btn" id="resetLabels" type="button">${htmlMsg("settings.resetNames")}</button>
        </div>
      </form>
    </div>`;
  const form = document.getElementById("settingsForm");
  const labelInputs = [...form.querySelectorAll("[data-label]")];
  const validateLabel = /** Set the browser's localized validation message for an invalid personal server name. */ input => input.setCustomValidity(validLocalLabel(input.value) ? "" : msg("settings.invalidName"));
  for (const input of labelInputs) {
    input.addEventListener("input", /** Revalidate the personal name as the user edits this field. */ () => validateLabel(input));
    validateLabel(input);
  }
  form.addEventListener("submit", /** Validate and save personal labels, update the header and rebuild the settings view. */ async event => {
    event.preventDefault();
    labelInputs.forEach(validateLabel);
    if (!form.reportValidity()) {
      return;
    }
    for (const input of labelInputs) {
      const server = configuredServers.find(/** Match the submitted name field to its configured instance. */ server => server.id === input.dataset.label);
      server.label = input.value.trim();
    }
    saveConfig();
    toast(msg("settings.saved"), "ok");
    renderPills();
    await switchTab("settings");
  });
  document.getElementById("resetLabels").addEventListener("click", /** Restore current central default names, clear redundant overrides and refresh the displayed labels. */ () => {
    for (const server of configuredServers) {
      server.label = server.defaultLabel;
    }
    saveConfig();
    toast(msg("settings.namesReset"), "ok");
    renderPills();
    void switchTab("settings");
  });
}
const THEME_KEY = "ph_combo_theme";
/** Return the saved light theme, otherwise default to dark. */
function loadTheme() {
  return storedValue(THEME_KEY) === "light" ? "light" : "dark";
}
/**
 * Apply the theme attribute used by the page's CSS variables.
 * The caller is responsible for persisting the choice and rebuilding chart colors.
 */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
}
/**
 * Apply the stored theme and bind the toggle to persist changes and refresh the current view.
 * The current theme refresh rebuilds the tab and does not preserve unfinished form drafts.
 */
function initThemeToggle() {
  applyTheme(loadTheme());
  document.getElementById("themeToggle").addEventListener("click", /** Switch between light and dark, save the choice and repaint the active tab or configuration message. */ () => {
    const theme = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(theme);
    storeValue(THEME_KEY, theme);
    if (configurationStatus === "ready") {
      void switchTab(state.activeTab);
    } else {
      renderConfigurationState();
    }
  });
}
/** Initialize language and theme controls, resolve the initial tab and begin validated configuration loading. */
async function bootstrap() {
  initI18n();
  initThemeToggle();
  state.activeTab = tabFromHash();
  await loadRuntimeConfiguration();
}
// Start the dashboard.
window.addEventListener("hashchange", /** Follow browser fragment changes without writing another fragment update or reopening the current tab. */ () => {
  const tabId = tabFromHash();
  if (tabId !== state.activeTab) {
    switchTab(tabId, false);
  }
});
void bootstrap();
</script>
