/* Keyed messages are shared by all three languages. Catalogs contain plain text only. */
const APP_VERSION = "1.5.009";
const LANGUAGE_KEY = "ph_combo_language";
const SUPPORTED_LANGUAGES = Object.freeze({
  da: { label: "Dansk", locale: "da-DK" },
  en: { label: "English", locale: "en-GB" },
  de: { label: "Deutsch", locale: "de-DE" }
});

/** Read an optional browser preference; restricted storage keeps the UI usable. */
function storedValue(key, storageName = "localStorage") {
  try { return window[storageName].getItem(key); } catch { return null; }
}

/** Persist a preference when browser storage is available. */
function storeValue(key, value, storageName = "localStorage") {
  try {
    if (value === null) window[storageName].removeItem(key);
    else window[storageName].setItem(key, value);
  } catch { /* Preferences and sessions continue in memory for this page. */ }
}

/** Normalize supported language tags, including regional tags such as de-AT. */
function normalizeLanguage(value) {
  if (typeof value !== "string") return null;
  const code = value.trim().toLowerCase().replaceAll("_", "-").split("-")[0];
  return Object.hasOwn(SUPPORTED_LANGUAGES, code) ? code : null;
}

/** User preference, central default, ordered browser preferences, then English. */
function resolveLanguage(saved, browserLanguages = [], configuredDefault = "auto") {
  const preferred = normalizeLanguage(saved);
  if (preferred) return preferred;
  const configured = normalizeLanguage(configuredDefault);
  if (configured) return configured;
  for (const language of Array.isArray(browserLanguages) ? browserLanguages : [browserLanguages]) {
    const code = normalizeLanguage(language);
    if (code) return code;
  }
  return "en";
}

let currentLanguage = resolveLanguage(storedValue(LANGUAGE_KEY),
  [...(navigator.languages || []), navigator.language]);
let pendingLanguageFormState = null;
let languageChosenThisPage = false;

function localeCode() {
  return SUPPORTED_LANGUAGES[currentLanguage]?.locale || SUPPORTED_LANGUAGES.en.locale;
}

/** Look up a key and interpolate named values once; values are never translated. */
function msg(key, params = {}) {
  const catalog = I18N[currentLanguage] || I18N.en;
  const template = Object.hasOwn(catalog, key) ? catalog[key]
    : Object.hasOwn(I18N.en, key) ? I18N.en[key] : key;
  return template.replace(/\{([A-Za-z][A-Za-z0-9_]*)\}/gu, (placeholder, name) =>
    Object.hasOwn(params, name) ? String(params[name]) : placeholder);
}

/** Escape the complete message, including parameters, before inserting it into HTML. */
function htmlMsg(key, params = {}) {
  return escapeHtml(msg(key, params));
}

/** Select the catalog's grammatical number and localize the visible count. */
function msgCount(key, count, params = {}) {
  const category = new Intl.PluralRules(localeCode()).select(count);
  return msg(`${key}.${category}`, { ...params, count: fmtNum(count) });
}

/** Translate only elements and attributes explicitly bound to keys. */
function applyI18n(root = document) {
  for (const [binding, attribute] of [
    ["data-i18n", null], ["data-i18n-title", "title"],
    ["data-i18n-aria-label", "aria-label"], ["data-i18n-placeholder", "placeholder"],
    ["data-i18n-content", "content"]
  ]) {
    const elements = [...root.querySelectorAll(`[${binding}]`)];
    if (root.matches?.(`[${binding}]`)) elements.unshift(root);
    for (const element of elements) {
      const text = msg(element.getAttribute(binding), { version: APP_VERSION });
      if (attribute) element.setAttribute(attribute, text);
      else element.textContent = text;
    }
  }
}

/** Identify form fields without relying on translated labels or placeholders. */
function formFieldSelector(element) {
  if (element.hasAttribute("data-form-state-key")) {
    return `[data-form-state-key="${CSS.escape(element.getAttribute("data-form-state-key"))}"]`;
  }
  if (element.id) return `#${CSS.escape(element.id)}`;
  const attributes = [...element.attributes].filter(attribute =>
    attribute.name.startsWith("data-") || attribute.name === "name");
  if (!attributes.length) return null;
  return element.tagName.toLowerCase() + attributes.map(attribute =>
    `[${CSS.escape(attribute.name)}="${CSS.escape(attribute.value)}"]`).join("");
}

/** Keep unfinished edits and focused fields when the current tab is re-rendered. */
function captureFormState() {
  const root = document.getElementById("tabContent");
  return {
    fields: [...root.querySelectorAll("input, select, textarea")].flatMap(element => {
      const selector = formFieldSelector(element);
      return selector ? [{ selector, element, value: element.value, checked: element.checked,
        focused: element === document.activeElement,
        start: element.selectionStart, end: element.selectionEnd }] : [];
    }),
    details: [...root.querySelectorAll("details")].map(element => element.open)
  };
}

/** Carry drafts through overlapping language renders while accepting newer user edits. */
function mergeFormState(previous, current) {
  if (!previous) return current;
  const fields = new Map(previous.fields.map(field => [field.selector, { ...field, restoredElement: null }]));
  for (const field of current.fields) {
    const earlier = previous.fields.find(candidate => candidate.selector === field.selector);
    // A placeholder control that has not yet received its draft must not replace it.
    if (!earlier || earlier.restoredElement === field.element) fields.set(field.selector, field);
  }
  return { fields: [...fields.values()], details: current.details.length ? current.details : previous.details };
}

/** Accept edits to asynchronously populated controls while a language render is pending. */
function recordPendingFormEdit(event) {
  const pending = pendingLanguageFormState;
  const element = event.target;
  if (!pending || pending.generation !== state.renderGen || pending.tab !== state.activeTab
    || !element.matches?.("input, select, textarea")) return;
  const selector = formFieldSelector(element);
  if (!selector) return;
  let field = pending.snapshot.fields.find(candidate => candidate.selector === selector);
  if (!field) {
    field = { selector };
    pending.snapshot.fields.push(field);
  }
  Object.assign(field, { element, restoredElement: element, value: element.value,
    checked: element.checked, focused: element === document.activeElement,
    start: element.selectionStart, end: element.selectionEnd });
}

function restoreFormState(snapshot) {
  const root = document.getElementById("tabContent");
  for (const field of snapshot.fields) {
    const element = root.querySelector(field.selector);
    // Preserve user edits and programmatic submission clears on already-restored nodes.
    if (!element || field.restoredElement === element) continue;
    if (element.tagName !== "SELECT" || [...element.options].some(option => option.value === field.value)) {
      element.value = field.value;
      field.restoredElement = element;
    }
    if (typeof field.checked === "boolean") element.checked = field.checked;
    if (field.focused) {
      element.focus({ preventScroll: true });
      if (field.start !== null && typeof element.setSelectionRange === "function") {
        element.setSelectionRange(field.start, field.end);
      }
    }
  }
  [...root.querySelectorAll("details")].forEach((element, index) => {
    if (index < snapshot.details.length) element.open = snapshot.details[index];
  });
}

/** Apply a language to the shell and active tab without changing configuration or logins. */
async function setLanguage(language, rerender = true) {
  const code = normalizeLanguage(language) || "en";
  languageChosenThisPage = true;
  const previous = pendingLanguageFormState?.generation === state.renderGen
    && pendingLanguageFormState.tab === state.activeTab ? pendingLanguageFormState.snapshot : null;
  const snapshot = rerender && configurationStatus === "ready"
    ? mergeFormState(previous, captureFormState()) : null;
  currentLanguage = code;
  storeValue(LANGUAGE_KEY, code);
  document.documentElement.lang = code;
  const select = document.getElementById("languageSelect");
  if (select) select.value = code;
  applyI18n();
  renderTabs();
  renderPills();
  if (configurationStatus !== "ready") {
    renderConfigurationState();
    return;
  }
  if (rerender && state.activeTab) {
    const tab = state.activeTab;
    const rendering = switchTab(tab, false);
    const generation = state.renderGen;
    pendingLanguageFormState = { tab, generation, snapshot };
    restoreFormState(snapshot);
    await rendering;
    if (state.renderGen === generation && state.activeTab === tab && currentLanguage === code) {
      restoreFormState(snapshot);
      pendingLanguageFormState = null;
    }
  }
}

function initI18n() {
  const select = document.getElementById("languageSelect");
  select.innerHTML = Object.entries(SUPPORTED_LANGUAGES).map(([code, language]) =>
    `<option value="${code}" lang="${code}">${escapeHtml(language.label)}</option>`).join("");
  select.value = currentLanguage;
  select.addEventListener("change", () => { void setLanguage(select.value); });
  const content = document.getElementById("tabContent");
  content.addEventListener("input", recordPendingFormEdit);
  content.addEventListener("change", recordPendingFormEdit);
  document.documentElement.lang = currentLanguage;
  applyI18n();
}

function uiConfirm(message) { return window.confirm(message); }
function uiPrompt(message, defaultValue = "") { return window.prompt(message, defaultValue); }

class ConfigurationError extends Error {
  constructor(key, params = {}) {
    super(key);
    this.key = key;
    this.params = params;
  }
}

/** Accept only the public projection produced by tools/render_config.py. */
function validateRuntimeConfig(input) {
  const invalid = field => { throw new ConfigurationError("config.invalidValue", { field }); };
  const objectWithKeys = (value, allowed, field) => {
    if (!value || typeof value !== "object" || Array.isArray(value)
      || Object.keys(value).some(key => !allowed.includes(key))) invalid(field);
  };
  objectWithKeys(input, ["version", "defaultLanguage", "servers"], "config");
  if (input.version !== 1) throw new ConfigurationError("config.unsupportedVersion");
  const defaultLanguage = input.defaultLanguage === undefined ? "auto" : input.defaultLanguage;
  if (!["auto", "da", "en", "de"].includes(defaultLanguage)) invalid("defaultLanguage");
  if (!Array.isArray(input.servers) || input.servers.length < 2 || input.servers.length > 4) invalid("servers");
  const ids = new Set();
  const servers = input.servers.map((server, index) => {
    const field = `servers[${index}]`;
    objectWithKeys(server, ["id", "label", "base"], field);
    if (typeof server.id !== "string" || !/^[1-4]$/u.test(server.id) || ids.has(server.id)) invalid(`${field}.id`);
    ids.add(server.id);

  return a = a.replace(/(\u001B\[(?:1|90|91|32|33|94|95|96|0)m)/gu, t => {
    if ("[0m" === t) {
      const t = "</span>".repeat(n);
      return n = 0, t;
    }
    return e[t] ? (n++, `<span class="${e[t]}">`) : "";
  }), a + "</span>".repeat(n);
}
/**
 * Render Gravity status without tying an active update to the current language or
 * tab. The server's unmodified output is retained independently of the DOM; only
 * dashboard-owned status messages are translated when the view is repainted.
 */
async function renderGravity(t, e) {
  const runs = state.gravityRuns || (state.gravityRuns = new Map());

  function runFor(server) {
    if (!runs.has(server.id)) runs.set(server.id, {
      rawLog: "",
      running: false,
      status: "ready",
      lastStatus: server.connected ? "loading" : "notLoggedIn",
      lastUpdate: null,
      error: "",
      httpStatus: null
    });
    return runs.get(server.id);
  }

  function paint(server) {
    const run = runFor(server),
      last = document.getElementById("gravLast" + server.id),
      button = document.getElementById("gravBtn" + server.id),
      log = document.getElementById("gravLog" + server.id);
    if (last) last.textContent = run.lastStatus === "loaded"
      ? fmtDate(run.lastUpdate)
      : msg("gravity." + run.lastStatus);
    if (button) button.disabled = !server.connected || run.running;
    if (!log) return;
    let content = ansiToHtml(run.rawLog).replaceAll("\r", "\n");
    if (run.status === "done") content += "\n--- " + htmlMsg("gravity.done") + " ---";
    else if (run.status === "httpError") content = htmlMsg("gravity.httpError", {status: run.httpStatus});
    else if (run.status === "error") content = htmlMsg("gravity.error", {error: run.error});
    else if (!run.rawLog) content = htmlMsg(run.running ? "gravity.running" : "gravity.ready");
    log.innerHTML = content;
    log.scrollTop = log.scrollHeight;
  }

  async function refreshLastUpdate(server) {
    const run = runFor(server);
    if (!server.connected) {
      run.lastStatus = "notLoggedIn";
      paint(server);
      return;
    }
    try {
      const data = await apiCall(server, "/stats/summary");
      run.lastUpdate = data?.gravity?.last_update;
      run.lastStatus = "loaded";
    } catch {
      run.lastStatus = server.connected ? "statusError" : "notLoggedIn";
    }
    paint(server);
  }

  async function update(server) {
    const run = runFor(server);
    if (run.running || !server.connected) return;
    Object.assign(run, {rawLog: "", running: true, status: "running", error: "", httpStatus: null});
    paint(server);
    try {
      const response = await apiCall(server, "/action/gravity?color=true", {
        method: "POST",
        rawResponse: true
      });
      if (response.ok && response.body) {
        const reader = response.body.getReader(),
          decoder = new TextDecoder();
        try {
          for (;;) {
            const {value, done} = await reader.read();
            if (done) break;
            run.rawLog += decoder.decode(value, {stream: true});
            paint(server);
          }
          run.rawLog += decoder.decode();
          run.status = "done";
        } finally {
          reader.releaseLock();
        }
        await refreshLastUpdate(server);
      } else {
        run.status = "httpError";
        run.httpStatus = response.status;
      }
    } catch (error) {
      run.status = "error";
      run.error = error.message;
    } finally {
      run.running = false;
      paint(server);
    }
  }

  t.innerHTML = `<div class="grid cols-2">
    ${state.servers.map(server => `<div class="card">
      <h2 class="flex-between"><span><span class="tag tag-${escapeHtml(server.chip.slice(1))}">${escapeHtml(server.label)}</span> ${htmlMsg("gravity.title")}</span></h2>
      <div class="stat-row" style="margin-bottom:12px;"><span class="k">${htmlMsg("gravity.lastUpdate")}</span><span class="v" id="gravLast${escapeHtml(server.id)}"></span></div>
      <div id="gravLogin${escapeHtml(server.id)}">${server.connected ? "" : loginBoxHtml(server)}</div>
      <button class="btn primary block" id="gravBtn${escapeHtml(server.id)}" ${!server.connected || runFor(server).running ? "disabled" : ""}>${htmlMsg("gravity.updateServer", {server: server.label})}</button>
      <pre class="log" id="gravLog${escapeHtml(server.id)}" style="margin-top:12px;"></pre>
    </div>`).join("")}
  </div>`;
  for (const server of state.servers) {
    bindLoginHandlers(document.getElementById("gravLogin" + server.id), () => switchTab("gravity"));
    document.getElementById("gravBtn" + server.id).addEventListener("click", () => update(server));
    paint(server);
  }
  await Promise.all(state.servers.map(refreshLastUpdate));
}

async function renderSettings(t) {
  t.innerHTML = `
    <details class="help">
      <summary>${htmlMsg("settings.helpSummary")}</summary>
      <div class="help-body">
        <p>${htmlMsg("settings.proxyRequirement")}</p>
        <ul>${state.servers.map(server => `<li><span class="server-chip ${escapeHtml(server.chip)}">${escapeHtml(server.label)}</span>: <code style="overflow-wrap:anywhere">${escapeHtml(server.base)}</code></li>`).join("")}</ul>
        <p>${htmlMsg("settings.proxyExample")} <code>config.json</code></p>
        <p>${htmlMsg("settings.proxyConfiguration")}</p>
        <h3>${htmlMsg("settings.appPasswordTitle")}</h3>
        <p>${htmlMsg("settings.appPasswordHelp")}</p>
        <h3>${htmlMsg("settings.sessionsTitle")}</h3>
        <p>${htmlMsg("settings.sessionsHelp")}</p>
      </div>
    </details>
    <div class="card">
      <h2>${htmlMsg("settings.title")}</h2>
      <form id="settingsForm">
        <p class="sub">${htmlMsg("settings.namesHelp")}</p>
        ${state.servers.map(server => `<div class="row-inline" style="margin-bottom:10px;">
          <span class="server-chip ${escapeHtml(server.chip)}">${htmlMsg("settings.server", {id: server.id})}</span><label class="field" style="max-width:260px;"><span>${htmlMsg("settings.label")}</span><input type="text" data-label="${escapeHtml(server.id)}" value="${escapeHtml(server.label)}" required></label>
        </div>`).join("")}
        <div class="row-inline">
          <button class="btn primary" type="submit">${htmlMsg("settings.save")}</button>
          <button class="btn" id="resetLabels" type="button">${htmlMsg("settings.resetNames")}</button>
        </div>
      </form>
    </div>`;
  const form = document.getElementById("settingsForm");
  const labelInputs = [...form.querySelectorAll("[data-label]")];
  const validateLabel = input => input.setCustomValidity(validLocalLabel(input.value) ? "" : msg("settings.invalidName"));
  for (const input of labelInputs) {
    input.addEventListener("input", () => validateLabel(input));
    validateLabel(input);
  }
  form.addEventListener("submit", async event => {
    event.preventDefault();
    labelInputs.forEach(validateLabel);
    if (!form.reportValidity()) return;
    for (const input of labelInputs) {
      const server = configuredServers.find(server => server.id === input.dataset.label);
      server.label = input.value.trim();
    }
    saveConfig();
    toast(msg("settings.saved"), "ok");
    renderPills();
    await switchTab("settings");
  });
  document.getElementById("resetLabels").addEventListener("click", () => {
    for (const server of configuredServers) server.label = server.defaultLabel;
    saveConfig();
    toast(msg("settings.namesReset"), "ok");
    renderPills();
    void switchTab("settings");
  });
}

const THEME_KEY = "ph_combo_theme";
function loadTheme() {
  return "light" === storedValue(THEME_KEY) ? "light" : "dark";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
}
function initThemeToggle() {
  applyTheme(loadTheme()), document.getElementById("themeToggle").addEventListener("click", () => {
    const t = "light" === document.documentElement.getAttribute("data-theme") ? "dark" : "light";
    applyTheme(t), storeValue(THEME_KEY, t);
    if (configurationStatus === "ready") void switchTab(state.activeTab);
    else renderConfigurationState();
  });
}
async function bootstrap() {
  initI18n();
  initThemeToggle();
  state.activeTab = tabFromHash();
  await loadRuntimeConfiguration();
}
// Start the dashboard.
window.addEventListener("hashchange", () => {
  const t = tabFromHash();
  t !== state.activeTab && switchTab(t, !1);
});
void bootstrap();

</script>
