# Dedicated native dashboard instance; it runs entirely as dobbelt-pi-hole.
# Paths outside RuntimeDirectory are owned by root and are not writable here.
# The distribution's nginx.service is masked; this file is loaded by the
# dedicated systemd unit, which supplies the account and resource limits.
worker_processes 1;
pid /run/dobbelt-pi-hole/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # systemd stdout is a journal socket; /dev/stdout cannot reliably be reopened.
    # Send access entries to the CT's syslog socket and errors to service stderr.
    access_log syslog:server=unix:/dev/log,tag=dobbelt_pi_hole;
    sendfile on;

    # systemd creates and owns this temporary tree for the service at each start.
    client_body_temp_path /run/dobbelt-pi-hole/client_temp;
    proxy_temp_path /run/dobbelt-pi-hole/proxy_temp;
    fastcgi_temp_path /run/dobbelt-pi-hole/fastcgi_temp;
    uwsgi_temp_path /run/dobbelt-pi-hole/uwsgi_temp;
    scgi_temp_path /run/dobbelt-pi-hole/scgi_temp;

    # Startup/reload renders this http-context include from the private JSON and
    # installed HTML. Do not maintain a second set of Pi-hole routes in this file.
    include /run/dobbelt-pi-hole/nginx.conf;
}
